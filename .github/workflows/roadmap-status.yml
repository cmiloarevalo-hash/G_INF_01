name: Roadmap status snapshot

on:
  push:
    branches:
      - main
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  update-roadmap-status:
    name: Update roadmap status Issue
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Recompute machine snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/roadmap-status-generator.ts --update-issue
